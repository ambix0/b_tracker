<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Admin — BFM Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div>
    <div class="brand">BFM TRACKER</div>
    <div class="subtitle">Admin Portal</div>
  </div>
  <a class="admin-link" href="index.html">Dashboard</a>
</header>

<main class="container">
  <section id="loginCard" class="panel narrow">
    <p class="eyebrow">AUTHENTICATION</p>
    <h1>Sign In</h1>
    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" type="email" required autocomplete="username" placeholder="admin@domain.com">
      <label for="password">Password</label>
      <input id="password" type="password" required autocomplete="current-password" placeholder="••••••••">
      <button class="primary" type="submit">Sign In</button>
      <p id="loginMsg" class="error"></p>
    </form>
  </section>

  <section id="adminApp" hidden>
    <div class="hero">
      <div>
        <p class="eyebrow">ADMIN PANEL</p>
        <h1>Daily BFM Update</h1>
      </div>
      <button id="logout" class="secondary">Logout</button>
    </div>

    <section class="stats">
      <div class="stat"><span>Total</span><strong id="aTotal">—</strong></div>
      <div class="stat"><span>Updated</span><strong id="aUpdated">—</strong></div>
      <div class="stat"><span>Pending</span><strong id="aPending">—</strong></div>
      <div class="stat"><span>Progress</span><strong id="aCompletion">—</strong></div>
    </section>

    <section class="panel">
      <form id="updateForm">
        <label for="scheme">Select Scheme</label>
        <select id="scheme" required></select>

        <label for="mitra">Jal Mitra</label>
        <input id="mitra" readonly>

        <label for="date">Update Date</label>
        <input id="date" type="date" required>

        <label>Status</label>
        <div class="status-buttons">
          <button type="button" data-status="true" class="status-btn yes">✓ UPDATED</button>
          <button type="button" data-status="false" class="status-btn no">✕ NOT UPDATED</button>
        </div>

        <button class="primary" type="submit">Save Update</button>
        <div id="saveMsg" class="muted" style="margin-top: 10px; font-size: 13px;"></div>
      </form>
    </section>

    <section class="panel">
      <div class="section-head">
        <div>
          <h2>Recent Updates</h2>
        </div>
        <button id="refresh" class="secondary">Refresh</button>
      </div>
      <div id="recentUpdatesList" class="admin-card-list"></div>
    </section>

    <section class="panel">
      <div class="section-head">
        <div>
          <h2>Manage Schemes</h2>
        </div>
      </div>
      <form id="schemeForm" class="grid2">
        <div>
          <label for="newScheme">Scheme Name</label>
          <input id="newScheme" required placeholder="e.g. Uparcharia PWSS">
        </div>
        <div>
          <label for="newMitra">Jal Mitra Name</label>
          <input id="newMitra" required placeholder="e.g. Raju">
        </div>
        <div style="grid-column: 1 / -1;">
          <button class="primary" type="submit">+ Add Scheme</button>
          <div id="schemeMsg" class="muted" style="margin-top: 8px; font-size: 13px;"></div>
        </div>
      </form>
      <div id="schemesListMobile" class="admin-card-list" style="margin-top: 14px;"></div>
    </section>
  </section>
</main>

<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>

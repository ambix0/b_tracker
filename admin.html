<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BFM TRACKER — Admin</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar"><div class="brand">BFM TRACKER</div><div class="today">ADMIN</div></header>
<main class="container">
<section id="loginCard" class="panel login">
<div class="eyebrow">ADMIN LOGIN</div><h1>Sign in</h1>
<form id="loginForm"><label>Email</label><input id="email" type="email" required>
<label>Password</label><input id="password" type="password" required>
<button class="primary wide">LOGIN</button><p id="loginMsg" class="error"></p></form>
</section>

<section id="adminApp" hidden>
<div class="admin-head"><div><div class="eyebrow">ADMIN PANEL</div><h1>Daily BFM Update</h1></div><button id="logout" class="secondary">Logout</button></div>
<section class="stats">
<div class="stat"><small>Total</small><strong id="aTotal">—</strong></div><div class="stat"><small>✓ Updated</small><strong id="aUpdated">—</strong></div><div class="stat"><small>✕ Pending</small><strong id="aPending">—</strong></div><div class="stat"><small>Completion</small><strong id="aCompletion">—</strong></div>
</section>

<section class="panel">
<div class="section-title"><strong>DAILY UPDATE</strong><span id="saveMsg" class="muted"></span></div>
<form id="updateForm">
<label>Scheme</label><select id="scheme" required></select>
<label>Jal Mitra</label><input id="mitra" readonly>
<label>Date</label><input id="date" type="date" required>
<label>Status</label>
<div class="status-buttons"><button type="button" class="status-btn yes" data-status="true">✓ UPDATED</button><button type="button" class="status-btn no" data-status="false">✕ NOT UPDATED</button></div>
<button class="primary wide">SAVE UPDATE</button>
</form>
</section>

<section class="tool-grid">
<button class="tool" id="pendingBtn">⚠️ Pending Today</button>
<button class="tool" id="historyBtn">📋 Update History</button>
<button class="tool" id="reportBtn">📸 WhatsApp Report</button>
<button class="tool" id="csvBtn">📥 Excel/CSV Export</button>
</section>

<section id="pendingPanel" class="panel" hidden><div class="section-title"><strong>PENDING TODAY</strong><button class="secondary close-panel">Close</button></div><div id="pendingList"></div></section>
<section id="historyPanel" class="panel" hidden><div class="section-title"><strong>UPDATE HISTORY</strong><button class="secondary close-panel">Close</button></div><div class="filters"><input id="historySearch" placeholder="Search scheme or Jal Mitra"><input id="historyDate" type="date"></div><div class="table-wrap"><table><thead><tr><th>Scheme</th><th>Jal Mitra</th><th>Date</th><th>Status</th><th>Action</th></tr></thead><tbody id="historyBody"></tbody></table></div></section>

<section class="panel">
<div class="section-title"><div><strong>MANAGE SCHEMES</strong><div class="muted small">Scheme → Jal Mitra</div></div></div>
<form id="schemeForm" class="grid2"><div><label>Scheme Name</label><input id="newScheme" required></div><div><label>Jal Mitra Name</label><input id="newMitra" required></div><button class="primary">+ ADD SCHEME</button><span id="schemeMsg" class="muted"></span></form>
<div class="table-wrap"><table><thead><tr><th>Scheme</th><th>Jal Mitra</th><th>Action</th></tr></thead><tbody id="schemeBody"></tbody></table></div>
</section>
</section>
</main>
<script src="config.js"></script><script src="admin.js"></script>
</body></html>

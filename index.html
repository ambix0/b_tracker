<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BFM TRACKER</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar"><div class="brand">BFM TRACKER</div><div class="today" id="topDate"></div></header>
<main class="container">
<section class="hero"><div><div class="eyebrow">PUBLIC DASHBOARD</div><h1>Bulk Flow Meter Status</h1><p class="muted">Scheme-wise Jal Mitra updates</p></div></section>

<section class="stats">
<div class="stat"><small>Total Schemes</small><strong id="total">—</strong></div>
<div class="stat"><small>✓ Updated Today</small><strong id="updated">—</strong></div>
<div class="stat"><small>✕ Pending Today</small><strong id="pending">—</strong></div>
<div class="stat"><small>Completion</small><strong id="completion">—</strong></div>
</section>

<section class="panel search-panel">
<input id="search" type="search" placeholder="🔍  Search scheme or Jal Mitra">
</section>

<section class="section-title"><strong>SCHEMES</strong><span id="range" class="muted"></span></section>
<section id="schemeList"></section>
<nav class="pagination" id="pagination"></nav>
<section id="detail" class="detail" hidden></section>
<p id="message" class="message"></p>
</main>
<script src="config.js"></script><script src="app.js"></script>
</body>
</html>

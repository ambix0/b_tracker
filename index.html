<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BFM Update Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="public-header">
  <div class="brand-row"><span class="water">💧</span><div><div class="brand">BFM Update Tracker</div><div class="subtitle">Bulk Flow Meter daily status</div></div></div>
  <a href="admin.html" class="admin-link">Admin</a>
</header>

<main class="public-main">
<section class="daily-hero">
  <div><div class="eyebrow">DAILY STATUS</div><h1 id="today">—</h1></div>
  <div class="live-dot">● Live</div>
</section>

<section class="stats-grid">
  <div class="stat-card"><span class="stat-icon">◉</span><div><small>Total</small><strong id="total">—</strong><em>Functional</em></div></div>
  <div class="stat-card"><span class="stat-icon">✓</span><div><small>Updated Today</small><strong id="updated">—</strong><em>Today</em></div></div>
  <div class="stat-card"><span class="stat-icon">○</span><div><small>Pending Today</small><strong id="pending">—</strong><em>Functional</em></div></div>
  <div class="stat-card"><span class="stat-icon">%</span><div><small>Completion</small><strong id="completion">—</strong><em>of Functional</em></div></div>
</section>

<section class="search-box"><span>⌕</span><input id="search" placeholder="Search scheme or person..." autocomplete="off"></section>
<div id="message" class="message"></div>
<section id="schemeList" class="scheme-list"></section>
<div class="pagination"><button id="prev">‹</button><span id="pageInfo">1 / 1</span><button id="next">›</button></div>
</main>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
